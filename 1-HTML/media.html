<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
</head>
<body>
    <h1>This is media learning</h1>
    <img src="./images/hc.png" width="200px" alt="Hitesh photo">

<!-- Method for Adding image with caption  -->

  <figure>
    <img
        src="./images/hc.png"
        alt="The head and torso of a dinosaur skeleton;
            it has a large head with long sharp teeth"
        width="400"
        height="341" 
    />

        <figcaption>
            A T-Rex on display in the Manchester University Museum.
        </figcaption>
  </figure>

  <!-- Now adding Video -->

    <video src="./images/chai_pe_charcha-1080.mp4" width="800px" controls controlslist="nofullscreen nodownload noremoteplayback noplaybackrate foobar">

    <!-- controlslist="nofullscreen nodownload noremoteplayback noplaybackrate foobar"........This restricts the functionality such as nofullscreen nodownload noremoteplayback noplaybackrate foobar -->
     
    </video>


</body>
</html>
