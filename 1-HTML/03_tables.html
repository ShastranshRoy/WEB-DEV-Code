<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <table>
        <tr>

            <th>Email</th>
            <th>DOB</th>
        </tr>
        <tr>
            <td>Dudu</td>       <!-- td is used for table data  -->
            <td>Dudu@gmail.com</td>
            <td>02/07/2001</td>
        </tr>
        <tr>
            <td>Bubu</td>
            <td>Bubu@gmail.com</td>
            <td>21/05/2002</td>
        </tr>
    </table>
</body>
</html>
