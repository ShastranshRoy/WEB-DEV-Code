<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Login to Bubu Dudu World</h1>
    <form>
        <label for="Email">
            Email:
            <input placeholder="dudu@gmail.com" type="text" name="Email">
        </label>
        <label for="Password">
            Password:
            <input type="password" name="Password">
        </label>
        <button type="submit">Login</button>
        <button type="reset">Reset</button>
    </form>

    <div>
        <h1>Learning form with email specific input type</h1>
        <form>
            <label for="Email">
            Email:
            <input type="email" name="Email">
            </label>
            <button type="submit">submit</button>
        </form>
    </div>

    <div>
        <h1>Learning form with checkbox input type</h1>
        <form>
            <label for="Social Media apps">
            Instagram:
            <input type="checkbox" name="">
            </label>
            <label for="Social Media apps">
            Facebook:
            <input type="checkbox" name="">
            </label>
            <label for="Social Media apps">
            Snapchat:
            <input type="checkbox" name="">
            </label>
            <button type="submit">submit</button>
        </form>
    </div>

    <div>
        <h1>Learning form with dropdown specific input type</h1>
        <form>
            <label for="Social media Apps">
                Social Media Apps:
                <!-- <input type="checkbox" name="Social Media Apps" id=""> -->
            </label>
            <label for="Apps">
            <select name="Apps" id="">
                <option value="select from dropdown">Select from dropdown</option>
                <option value="Instagram">Instagram</option>
                <option value="Snapchat">Snapchat</option>
                <option value="Facebook">Facebook</option>
            </select>
            </label>
            <button type="submit">submit</button>
        </form>
    </div>

    <div>
        <h1>Bubu Dudu Anniversary Month</h1>
        <form>
            <label for="Anniversary Month">
                Anniversary Month:
                <input type="month" name="" id="">
            </label>
            <button type="submit">Submit</button>
        </form>
    </div>
    
    
</body>
</html>
